name: CI & Deploy

on:
  # Pull requests are verified but never released or deployed — the release/build/
  # deploy jobs below are all gated on `push`. Without this trigger a PR showed no
  # checks at all and the first CI run happened only after the merge landed.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the release job elevates what it actually needs.
permissions:
  contents: read

concurrency:
  # Scoped per ref so a pull request cannot queue behind (or ahead of) a main
  # deploy. Two pushes to main still share a group and stay serialised.
  group: pages-${{ github.ref }}
  cancel-in-progress: false # never cancel a run that may be mid-release-push

jobs:
  verify:
    # The gate. Runs for pull requests AND for main, so a squash-merged PR is
    # re-checked against the actual merge result before anything is released.
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  release:
    # Auto-release (semantic-release): feat → minor, fix/perf → patch; chore / docs /
    # ci / refactor / style / test → nothing. Bumps package.json, prepends CHANGELOG.md,
    # tags vX.Y.Z, creates a GitHub release, pushes "chore(release): X.Y.Z [skip ci]"
    # — remember to `git pull`. The gate skips non-releasable pushes (incl. dependabot
    # bumps) so they don't redeploy; semantic-release re-checks the commits itself too.
    needs: verify
    if: >
      github.event_name == 'push' &&
      (startsWith(github.event.head_commit.message, 'feat') ||
       startsWith(github.event.head_commit.message, 'fix') ||
       startsWith(github.event.head_commit.message, 'perf') ||
       contains(github.event.head_commit.message, 'BREAKING CHANGE'))
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release pushes the version-bump commit + tag
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs tags + full history
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  build:
    # Builds the post-release main tip so the served bundle matches the release.
    # A manual run (workflow_dispatch) always builds — an override. Never runs for
    # a pull request: `release` is push-only, and a PR is not a dispatch either.
    needs: [verify, release]
    if: >
      !cancelled() && needs.verify.result == 'success' &&
      (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # includes the release commit pushed by the job above
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (fetches zx-kit from npm)
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build

      - name: Verify dist/index.html exists
        run: test -f dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5 # v3 artifacts rejected by Pages backend since 2026-07-03
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5 # Node 24 native, pairs with upload v5

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
